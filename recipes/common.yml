---
modules:
  - type: dnf
    repos:
      copr:
        - cboxdoerfer/fsearch_nightly
        - peterwu/iosevka
      files:
        - claude-desktop-unofficial.repo
      keys:
        - https://pkg.claude-desktop-debian.dev/KEY.gpg
    install:
      packages:
        - btrfs-assistant
        - btrfsmaintenance
        - claude-desktop-unofficial
        - earlyoom
        - fsearch
        - gdb
        - gnupg2-scdaemon
        - iosevka-fixed-fonts
        - iosevka-fonts
        - iosevka-term-fonts
        - lldb
        - mkosi
        - neovim
        - onedrive
        - setroubleshoot
        - snapper
        - strace
        - syncthing

  - type: script
    scripts:
      - metered.sh

  - type: systemd
    system:
      enabled:
        - btrfs-balance.timer
        - btrfs-scrub.timer
        - btrfs-trim.timer
        - earlyoom.service
        - snapper-boot.timer
        - snapper-cleanup.timer
        - snapper-timeline.timer
        - podman-auto-update.timer
      disabled:
        - NetworkManager-wait-online.service
        - tailscaled.service
      masked:
        - systemd-remount-fs.service
        - zfs-import.service
        - zfs.target
    user:
      enabled:
        - podman-auto-update.timer
        - podman.socket

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

